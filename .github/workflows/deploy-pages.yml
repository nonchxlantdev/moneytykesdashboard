name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Build
        env:
          # moneytykes/teacher-dashboard → /teacher-dashboard/
          # nonchxlantdev/moneytykesdashboard → /moneytykesdashboard/
          VITE_BASE_PATH: ${{ github.repository == 'moneytykes/teacher-dashboard' && '/teacher-dashboard/' || '/moneytykesdashboard/' }}
          VITE_USE_SUPABASE: ${{ vars.VITE_USE_SUPABASE || 'false' }}
          # Demo login only on the public prototype fork — production stays fail-closed.
          VITE_ALLOW_DEMO_MODE: ${{ github.repository == 'moneytykes/teacher-dashboard' && 'false' || 'true' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add GitHub Pages SPA support
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
